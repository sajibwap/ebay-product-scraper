<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eBay Product Scraper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
        </div>
        <div>
          <div class="app-title">eBay Scraper</div>
          <div class="app-subtitle">Product Data Extractor</div>
        </div>
      </div>
      <button id="btn-scrape" class="btn-scrape" title="Scrape product data">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-3.56"/>
        </svg>
        Scrape
      </button>
    </header>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar status-idle">
      <span id="status-text">Click "Scrape" on an eBay product page</span>
    </div>

    <!-- Data fields -->
    <div id="fields-container" class="fields-container">
      <!-- Dynamically populated -->
    </div>

    <!-- Actions footer -->
    <div id="footer" class="footer" style="display:none">
      <button id="btn-copy-all" class="btn-action btn-primary">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy All
      </button>
      <button id="btn-copy-json" class="btn-action btn-secondary">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        JSON
      </button>
      <button id="btn-desc" class="btn-action btn-ghost" style="display:none; margin-left:auto;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
        </svg>
        Description
      </button>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast">Copied!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
