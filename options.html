<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eBay Product Scraper — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
      </div>
      <div>
        <h1>eBay Scraper Settings</h1>
        <p class="subtitle">AI service used to generate bullet points</p>
      </div>
    </header>

    <section class="card">
      <div class="field">
        <label for="provider">AI service</label>
        <select id="provider"></select>
      </div>

      <div class="field" id="base-url-field">
        <label for="base-url">Base URL</label>
        <input id="base-url" type="url" placeholder="https://openrouter.ai/api/v1" spellcheck="false">
        <p class="help">Any OpenAI-compatible API — the extension calls <code>/chat/completions</code> under this URL.</p>
      </div>

      <div class="field">
        <label for="api-key">API key</label>
        <div class="input-row">
          <input id="api-key" type="password" placeholder="Paste your API key" autocomplete="off" spellcheck="false">
          <button id="btn-toggle-key" type="button" class="btn btn-secondary">Show</button>
        </div>
        <p class="help">
          A separate key is kept for each service, stored only in this browser.
          <a id="key-link" href="#" target="_blank" rel="noopener">Get a key</a>
        </p>
      </div>

      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" list="model-list" spellcheck="false">
        <datalist id="model-list"></datalist>
        <p class="help">Pick a suggestion or type any model ID the service offers.</p>
      </div>

      <div class="field">
        <label for="instructions">Extra instructions <span class="optional">(optional)</span></label>
        <textarea id="instructions" rows="3" placeholder="e.g. Write in a friendly tone. Start each bullet with a capitalised keyword."></textarea>
      </div>

      <div class="actions">
        <button id="btn-save" type="button" class="btn btn-primary">Save</button>
        <button id="btn-test" type="button" class="btn btn-secondary">Test connection</button>
        <span id="status" class="status"></span>
      </div>
    </section>
  </main>

  <script src="ai.js"></script>
  <script src="options.js"></script>
</body>
</html>
